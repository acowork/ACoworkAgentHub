name: validate

# Runs the exact checks a contributor can run locally:
#   python tools/validate.py
#   python tools/pack.py <dir> --out dist/ --key <key>
#   python tools/pack.py --verify dist/<agent_id>.agent
#
# Nothing produced here is committed: packages, checksums, signatures and
# index.json are CI artifacts only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests, pack and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema cryptography

      - name: Clone the main repo (upstream source of truth)
        env:
          MAIN_REPO: acowork/ACowork
        # Exactly one clone per job, and idempotent: `git clone` refuses a
        # non-empty destination and fails instantly, so a repeated clone into
        # ../main-repo would break every later step that reuses this checkout.
        run: |
          if [ -d ../main-repo/.git ]; then
            echo "reusing the existing ../main-repo checkout"
          else
            git clone --depth 1 --single-branch --branch master "https://github.com/$MAIN_REPO.git" ../main-repo
          fi

      # The main repo's `examples/*` is the source of truth for the platform
      # agents mirrored under agents/official/. If the main repo changed,
      # this mirror is stale and the hub would publish the old packages.
      - name: Check the official-agent mirror against the main repo
        run: python tools/sync-official.py --main-repo ../main-repo --check

      - name: Validate all agent manifests
        run: python tools/validate.py --check-template --strict

      - name: Generate an ephemeral signing key (CI only, never persisted)
        run: python tools/make-ci-key.py --output-dir .keys/ci --ephemeral

      - name: Pack and verify every agent
        run: python tools/ci-pack-all.py --out dist --key .keys/ci/registry.key

      # The publish gate is the rule "a push that does not change the published
      # bytes does not republish". Tested here, on every PR, because a gate that
      # is only exercised in publish.yml is a gate that silently republishes
      # everything (or silently never publishes) until the next release.
      # The incremental behaviour of the publish pipeline: nothing repacked when
      # nothing changed, the changed list cannot lie its way into a stale
      # package, a key rotation forces re-signing, a builder-only change is
      # attributed correctly, and line endings are not content.
      #
      # This replaces two inline steps that mutated the checked-out tree with
      # `printf >>` and restored it with `git checkout`. That pattern is how an
      # uncommitted fix gets silently discarded by a test run, and it hardcoded
      # the agent count and one agent id, so it broke on every addition.
      - name: Publish pipeline self test (incremental packing and the gate)
        run: python tools/selftest-publish.py

      - name: Tamper-detection self test
        run: python tools/selftest.py --key .keys/ci/registry.key

      - name: Build the index and validate it against the schema
        run: |
          python tools/build-index.py --out dist/index.json --packages dist/
          python tools/check-index.py dist/index.json schema/agent.schema.json

      # The site is rendered entirely by JavaScript from the index. A 200 on
      # index.html proves nothing, so the page is opened in a real browser:
      # the cards must render, the facets must populate, the filters must
      # narrow the list and every download link must resolve.
      - name: Build the site and render it in a headless browser
        run: |
          python tools/build-site.py --index dist/index.json --packages dist/ --out dist/site
          pip install playwright
          python -m playwright install --with-deps chromium
          python tools/check-site.py --site dist/site

      # The manifest schema is a MIRROR of the main repo's AgentManifest, and
      # a mirror can drift. Only the main repo's real parser can settle
      # whether a package would install, so the guard runs there.
      #
      # ACOWORK_HUB_DIR points the guard at this checkout's agents/. Without
      # it the guard cannot find its subject and fails — it never skips.
      - name: Interop check against the main repo
        env:
          ACOWORK_HUB_DIR: ${{ github.workspace }}/agents
        run: |
          command -v cargo >/dev/null || { echo "cargo not found on this runner" >&2; exit 1; }
          cp tools/interop-test/main_repo_interop.rs ../main-repo/core/acowork-core/tests/hub_interop.rs
          cd ../main-repo/core
          cargo test -p acowork-core --test hub_interop

      - name: Upload packages and index as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-packages
          path: dist/
          retention-days: 7
