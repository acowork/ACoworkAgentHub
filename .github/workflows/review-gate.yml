name: review-gate

# Submission gate. A pull request that adds or changes an agent may only be
# merged after a maintainer has applied the `approved` label.
#
# Why the label alone and not label + approving review: the review used to be
# the accountability key, but with a single maintainer operating both the
# submitting and the reviewing account, GitHub's no-self-approval rule turns
# the review into a login-switching ritual that proves nothing a label click
# does not. The label remains a deliberate human act on a deliberate surface,
# and `changes-requested` still blocks.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-gate:
    name: Require maintainer approval
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'approved') ||
       github.event.action == 'opened' ||
       github.event.action == 'reopened' ||
       github.event.action == 'synchronize' ||
       github.event.action == 'ready_for_review')
    steps:
      - name: Check for the approved label
        id: label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const approved = labels.includes('approved');
            const changesRequested = labels.includes('changes-requested');
            core.setOutput('approved', String(approved && !changesRequested));
            core.info(`labels: ${labels.join(', ') || '(none)'}`);

      - name: Fail when the submission is not approved
        if: steps.label.outputs.approved != 'true'
        run: |
          echo "::error::This submission needs maintainer approval: apply the 'approved' label (and remove 'changes-requested' if present)."
          exit 1
