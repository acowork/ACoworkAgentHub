name: publish

# Rebuild the whole registry on main: pack every agent, sign it with the
# registry key, regenerate index.json, build the site, and publish both.
#
# Nothing is committed to the repository. The Release is the single
# distribution point for the community registry; hub.acowork.ai is
# served from the same build, so the page and the index can never drift.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not publish a Release or deploy"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Pack, sign and publish the registry
    runs-on: ubuntu-latest
    env:
      # Cloudflare Pages project for hub.acowork.ai. The token and the
      # account id are repository secrets; the project name is a constant.
      CLOUDFLARE_PROJECT_NAME: acowork-agent-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema cryptography

      - name: Validate all agent manifests
        run: python tools/validate.py --check-template --strict

      - name: Clone the main repo (upstream source of truth)
        env:
          MAIN_REPO: acowork/ACowork
        # Exactly one clone per job, and idempotent: `git clone` refuses a
        # non-empty destination and fails instantly, so a repeated clone into
        # ../main-repo would break every later step that reuses this checkout.
        run: |
          if [ -d ../main-repo/.git ]; then
            echo "reusing the existing ../main-repo checkout"
          else
            git clone --depth 1 --single-branch --branch master "https://github.com/$MAIN_REPO.git" ../main-repo
          fi

      # The main repo's `examples/*` is the source of truth for the platform
      # agents mirrored under agents/official/. Publishing a stale mirror
      # would ship packages the main repo has already replaced.
      - name: Check the official-agent mirror against the main repo
        run: python tools/sync-official.py --main-repo ../main-repo --check

      - name: Restore the registry signing key
        env:
          REGISTRY_KEY_B64: ${{ secrets.ACOWORK_AGENTS_SIGNING_KEY }}
        run: |
          if [ -z "$REGISTRY_KEY_B64" ]; then
            echo "::error::secret ACOWORK_AGENTS_SIGNING_KEY is not configured"
            exit 1
          fi
          mkdir -p .keys
          python -c "import base64,os,sys; open('.keys/registry.key','wb').write(base64.b64decode(os.environ['REGISTRY_KEY_B64']))"
          chmod 600 .keys/registry.key

      - name: Pack and sign every agent
        run: python tools/ci-pack-all.py --out dist --key .keys/registry.key

      - name: Tamper-detection self test (official channel key)
        run: python tools/selftest.py --key .keys/registry.key

      - name: Build the index
        run: python tools/build-index.py --out dist/index.json --packages dist/ --repo "${{ github.server_url }}/${{ github.repository }}"

      - name: Validate the index
        run: python tools/check-index.py dist/index.json schema/agent.schema.json

      # Every published package must also be accepted by the main repo's own
      # manifest parser. A hub-only field that slipped into manifest.toml
      # would be silently dropped on clone — and the package would break.
      #
      # ACOWORK_HUB_DIR points the guard at this checkout's agents/. Without
      # it the guard cannot find its subject and fails — it never skips.
      - name: Interop check against the main repo
        env:
          ACOWORK_HUB_DIR: ${{ github.workspace }}/agents
        run: |
          command -v cargo >/dev/null || { echo "::error::cargo not found on this runner" >&2; exit 1; }
          cp tools/interop-test/main_repo_interop.rs ../main-repo/core/acowork-core/tests/hub_interop.rs
          cd ../main-repo/core
          cargo test -p acowork-core --test hub_interop

      - name: Build the site
        run: python tools/build-site.py --index dist/index.json --packages dist/ --out dist/site

      - name: Render the site in a headless browser and check it
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tools/check-site.py --site dist/site --screenshot dist/site.png

      - name: Write checksums for the release
        run: |
          cd dist
          sha256sum *.agent > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y-%m-%d)-${GITHUB_SHA::8}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Community agent registry snapshot. Generated by publish.yml from ${GITHUB_SHA}." \
            dist/index.json dist/SHA256SUMS dist/*.agent dist/*.sha256

      # The site is deployed from the same build that produced the Release,
      # so the page, the index and the packages are always the same snapshot.
      - name: Deploy the site to Cloudflare Pages
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Pages secrets are not configured - skipping the site deploy"
            exit 1
          fi
          npx --yes wrangler@3 pages deploy dist/site \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch main \
            --commit-dirty=true

      - name: Upload the index as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-index
          path: dist/index.json
          retention-days: 30

      - name: Upload the built site as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-site
          path: dist/site
          retention-days: 30
