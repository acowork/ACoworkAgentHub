<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Research Agent avatar: a magnifying glass over a document">
  <title>Research Agent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- the document being read -->
  <rect x="12" y="12" width="27" height="36" rx="4" fill="#ffffff" opacity="0.94" />
  <g fill="#4f46e5">
    <rect x="17" y="19" width="17" height="3" rx="1.5" opacity="0.75" />
    <rect x="17" y="26" width="17" height="3" rx="1.5" opacity="0.45" />
    <rect x="17" y="33" width="11" height="3" rx="1.5" opacity="0.45" />
  </g>

  <!-- evidence nodes: the sources behind the claims -->
  <g fill="#f59e0b">
    <circle cx="17" cy="42" r="2.2" />
    <circle cx="24" cy="42" r="2.2" opacity="0.7" />
    <circle cx="31" cy="42" r="2.2" opacity="0.45" />
  </g>
  <path d="M17 42h14" stroke="#f59e0b" stroke-width="1.4" opacity="0.5" />

  <!-- the magnifying glass: the agent's job -->
  <circle cx="40" cy="35" r="10.5" fill="#f59e0b" fill-opacity="0.28" />
  <circle cx="40" cy="35" r="10.5" fill="none" stroke="#f59e0b" stroke-width="3.4" />
  <path d="M47.5 42.5 54 49" stroke="#f59e0b" stroke-width="4.2" stroke-linecap="round" />
  <circle cx="40" cy="35" r="4" fill="#ffffff" opacity="0.55" />
</svg>
