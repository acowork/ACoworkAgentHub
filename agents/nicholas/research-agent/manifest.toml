# Research Agent — an example community agent.
#
# manifest.toml is a faithful mirror of the main repo's AgentManifest
# (core/acowork-core/src/manifest.rs). Do not add hub-only fields here:
# they live in hub.json, next to this file.

agent_id = "io.github.nicholas.research-agent"
version = "0.1.0"
name = "research-agent"
display_name = "Research Agent"
role = "Research Analyst"
description = "Turns a question into a sourced, structured research brief with citations, confidence levels and open questions."
author = "Nicholas"
runtime_version = "0.1.0"
avatar = "assets/avatar.svg"

# Retrieval / discovery tags (ADR-104). The hub maps these onto browse
# categories via schema/catalog.json — the manifest never declares a category.
labels = ["research", "reporting", "summarization"]

identity_deps = ["language", "timezone"]

[[permissions]]
type = "FilesystemRead"

[[permissions]]
type = "Network"

[[tools]]
name = "web_fetch"

[[tools]]
name = "http_request"

[[tools]]
name = "doc_reader"

[capabilities.question_decomposition]
description = "Break a broad research question into answerable sub-questions with explicit scope and time bounds"
skills = ["research-synthesis"]

[capabilities.evidence_gathering]
description = "Collect and cross-check evidence from multiple sources, recording provenance for every claim"
skills = ["research-synthesis"]

[capabilities.brief_composition]
description = "Produce a structured research brief with citations, confidence levels and open questions"
skills = ["research-synthesis"]

[llm]
temperature = 0.3

[llm.routing]
strategy = "quality_priority"

[memory]
enabled = true
retention_days = 90

[resources]
max_memory_mb = 512
idle_timeout_secs = 1800

[sandbox]
enabled = false

[skills]
progressive = true
